    <!-- Panel shop gallery: every framing shop drawing, one click to open it. The link to send reviewers. -->
    <header class="bar">
        <a class="brand" href="home.html">CAS BIM Web Viewer</a><span>Panel shops</span>
        <nav class="links"><a href="takeoff.html">Takeoff</a><a href="index.html?demo=06-shop-drawings">3D viewer ↗</a></nav>
    </header>
    <main id="panels-main">
        <section class="card">
            <div class="row">
                <input type="search" id="search" placeholder="Find a panel: mark, wall type, room…" aria-label="Find a panel">
                <select id="level" aria-label="Level"><option value="">All levels</option></select>
                <select id="type" aria-label="Panel type"><option value="">All panel types</option></select>
                <select id="order" aria-label="Order"><option value="complex">Most openings first</option><option value="level">By level, then panel</option></select>
                <label><input type="checkbox" id="openings-only"> With openings only</label>
                <span class="muted" id="count"></span>
            </div>
        </section>
        <div class="gallery" id="gallery"><p class="muted">Loading the panels…</p></div>
    </main>
