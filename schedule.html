    <!-- The schedule link: the Install Progress Tracker (Demo 3) with the model and plan on top and its P6 schedule
         underneath (?tab=gantt or calendar; any other parameter is passed on). -->
    <script type="module">
        import { CONFIG } from './config.js';
        const params = new URLSearchParams(location.search);
        if (CONFIG.mode === 'static' && !CONFIG.tokenUrl) {
            document.body.innerHTML = '<p>The schedule opens with the 3D viewer, which is not connected on this site yet. <a href="home.html">Home</a></p>';
        } else {
            const to = new URLSearchParams(params);
            to.set('demo', '03-progress');
            to.set('layout', params.get('layout') || 'split');
            to.set('dock', 'bottom');
            to.set('tab', params.get('tab') || 'gantt');
            location.replace(`index.html?${to}`);
        }
    </script>
