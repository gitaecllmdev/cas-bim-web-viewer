    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takeoff · CAS BIM Web Viewer</title>
    <!-- The takeoff link: the 3D takeoff with the model and plan on top and the tables underneath. Its view is kept
         (?level=, the slicers, group=, tab=), so a link opens the same view. Without the viewer service (or with
         ?report=1) it opens the takeoff report instead. -->
    <script type="module">
        import { CONFIG } from './config.js';
        const params = new URLSearchParams(location.search);
        if ((CONFIG.mode === 'static' && !CONFIG.tokenUrl) || params.get('report') === '1') {
            params.delete('report');
            location.replace(`takeoff-report.html${params.toString() ? `?${params}` : ''}`);
        } else {
            const to = new URLSearchParams(params);
            to.set('demo', '02-takeoff');
            to.set('layout', params.get('layout') || 'split');
            to.set('dock', 'bottom');
            location.replace(`index.html?${to}`);
        }
    </script>
