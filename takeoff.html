<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takeoff · CAS BIM Web Viewer</title>
    <!-- The takeoff link: the 3D takeoff with the model and plan on top and the tables underneath (?level=... kept).
         Without the viewer service (or with ?report=1) it opens the takeoff report instead. -->
    <script type="module">
        import { CONFIG } from './config.js';
        const params = new URLSearchParams(location.search);
        if ((CONFIG.mode === 'static' && !CONFIG.tokenUrl) || params.get('report') === '1') {
            params.delete('report');
            location.replace(`takeoff-report.html${params.toString() ? `?${params}` : ''}`);
        } else {
            const to = new URLSearchParams({ demo: '02-takeoff', layout: 'split', dock: 'bottom' });
            if (params.get('level')) to.set('level', params.get('level'));
            location.replace(`index.html?${to}`);
        }
    </script>
</head>

<body>
    <p>Opening the takeoff… <a href="takeoff-report.html">Report without the 3D model</a></p>
</body>

</html>
